server:
  port: 8091

spring:
  application:
    name: api-gateway-auth-service

  # DataSource Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/lms_db
    username: LMS
    password: root
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

  cloud:
    gateway:
      routes:
        # More specific routes first
        - id: user-service-client-api
          uri: http://localhost:8081
          predicates:
            - Path=/lms/user/api/client-api/**
          filters:
            - RewritePath=/lms/user/api/client-api/(?<segment>.*), /api/service-api/${segment}
            - AddRequestHeader=X-Gateway-Service, user-service

        - id: course-service-client-api
          uri: http://localhost:8080
          predicates:
            - Path=/lms/course/api/client-api/**
          filters:
            - RewritePath=/lms/course/api/client-api/(?<segment>.*), /api/service-api/${segment}
            - AddRequestHeader=X-Gateway-Service, course-service

        - id: course-service-static-files
          uri: http://localhost:8080
          predicates:
            - Path=/lms/course/static/**
          filters:
            - StripPrefix=3

#        # General routes (less specific)
#        - id: user-service-general
#          uri: http://localhost:8081
#          predicates:
#            - Path=/user/**
#          filters:
#            - StripPrefix=1
#            - AddRequestHeader=X-Gateway-Service, user-service
#
#        - id: course-service-general
#          uri: http://localhost:8080
#          predicates:
#            - Path=/course/**
#          filters:
#            - StripPrefix=1
#            - AddRequestHeader=X-Gateway-Service, course-service
#
#      default-filters:
#        - AddResponseHeader=X-Gateway-Response, Gateway says hello!
#        - AddRequestHeader=X-Request-Id, ${requestId}

      # Global timeout settings
      httpclient:
        connect-timeout: 10000
        response-timeout: 60s

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.gateway.filter: TRACE
    org.springframework.cloud.gateway.route: TRACE
    org.springframework.cloud.gateway.handler: TRACE
    org.springframework.cloud.gateway.handler.predicate: TRACE
    org.springframework.security: DEBUG
    com.nt.api_gateway: DEBUG

# Management endpoints for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# JWT Configuration
jwt:
  secret: my_secret_key_my_secret_key_my_secret_key_for_production_use_stronger_key_256_bits_long
  issuer: https://auth.nucleusteq.com

  # Access token configuration (short-lived for client-to-service)
  access-token:
    expiration: 900000 # 15 minutes in milliseconds

  # Refresh token configuration (long-lived for token refresh)
  refresh-token:
    expiration: 604800000 # 7 days in milliseconds

  # Service token configuration (medium-lived for service-to-service)
  service-token:
    expiration: 3600000 # 1 hour in milliseconds

# Application specific configuration
app:
  security:
    # Token blacklist configuration (for logout functionality)
    token-blacklist:
      cleanup-interval: 3600000 # 1 hour
      max-size: 10000

    # Rate limiting configuration
    rate-limit:
      login-attempts: 5
      time-window: 300000 # 5 minutes

# Custom Gateway Security Configuration
gateway:
  security:
    enabled: true
  secret:
    value: your-super-secret-gateway-key-change-this-in-production

