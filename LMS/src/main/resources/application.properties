spring.application.name= user-service
spring.datasource.url=jdbc:postgresql://localhost:5432/lms
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
server.port=8081

logging.level.org.springframework.web=DEBUG

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.table=flyway_schema_history

# JPA Configuration (disable auto DDL since Flyway will handle it)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true




# JWT Configuration (should match API Gateway)(must be 256 bits for HS256 algorithm)
jwt.secret=my_secret_key_my_secret_key_my_secret_key_for_production_use_stronger_key_256_bits_long
jwt.issuer=https://auth.nucleusteq.com

# Gateway Security Configuration
gateway.validation.enabled=true
gateway.secret.header=X-Gateway-Secret
gateway.secret.value=your-super-secret-gateway-key-change-this-in-production

# Gateway signature validation (optional)
gateway.signature.header=X-Gateway-Signature

#Direct Access Security headers
direct.secret.header = X-Direct-Secret
direct.secret.value = your-super-secret-direct-key-change-this-in-production
