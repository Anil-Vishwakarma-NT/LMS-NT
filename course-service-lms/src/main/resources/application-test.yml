spring:
  application:
    name: course-service-lms

  datasource:
    url: jdbc:h2:tcp://localhost:9092/mem:shareddb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update  # Use 'update' instead of 'create-drop'

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
        trace: false

server:
  port: 8080 # Random port for tests

# Your other configurations...
jwt:
  secret: test_jwt_secret_for_testing_purposes_only
  issuer: http://test-issuer

