spring.application.name=course-service

server.port=8080

# DataSource
spring.datasource.url=jdbc:postgresql://<dev-rds-endpoint>:5432/lms
spring.datasource.username=dev_user
spring.datasource.password=dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# JWT (externalized via secrets)
jwt.secret=${JWT_SECRET}
jwt.issuer=https://auth.nucleusteq.com

# Gateway config
gateway.validation.enabled=false
gateway.secret.header=X-Gateway-Secret
gateway.secret.value=${GATEWAY_SECRET}
gateway.signature.header=X-Gateway-Signature

# Direct headers
direct.secret.header=X-Direct-Secret
direct.secret.value=${DIRECT_SECRET}
