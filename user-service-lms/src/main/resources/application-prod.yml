spring:
  application:
    name: user-service

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

aws:
  s3:
    bucket-name: your-bucket-name
  secretsmanager:
    region: ap-south-1
    secretName: /prod/lms/db/credentials

jwt:
  secret: ${JWT_SECRET}
  issuer: https://auth.nucleusteq.com

gateway:
  validation:
    enabled: true
  secret:
    header: X-Gateway-Secret
    value: ${GATEWAY_SECRET}
  signature:
    header: X-Gateway-Signature

direct:
  secret:
    header: X-Direct-Secret
    value: ${DIRECT_SECRET}
