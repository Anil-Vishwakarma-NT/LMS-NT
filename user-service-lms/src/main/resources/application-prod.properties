spring.application.name=user-service

server.port=8081

# DataSource
spring.datasource.url=jdbc:postgresql://<prod-rds-endpoint>:5432/lms
spring.datasource.username=dev_user
spring.datasource.password=dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.table=flyway_schema_history

# Logging
logging.level.org.springframework.web=INFO

# JWT (externalized via secrets)
jwt.secret=${JWT_SECRET}
jwt.issuer=https://auth.nucleusteq.com

# Gateway validation
gateway.validation.enabled=true
gateway.secret.header=X-Gateway-Secret
gateway.secret.value=${GATEWAY_SECRET}
gateway.signature.header=X-Gateway-Signature

# Direct headers
direct.secret.header=X-Direct-Secret
direct.secret.value=${DIRECT_SECRET}
